<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="fbheader">
        <h1 class="fblogo">facebook</h1>
        <div class="logform">
            <label for="" id="keeplog">
            <input type="checkbox">keep me logged in
            </label>
            <label for="" id="emaillab">Email or phone</label>
            <input type="text">
            <label for="" id="pswdlab">Password</label>
            <input type="text">
            <p id="forget">Forgot Password?</p>
            <button id="logbtn">Login</button>
        </div>
    </header>
    <p id="main">
            Facebook helps you connect and share with<br>
             the people in your life.
        </p>
        <img src="./facebook!.jpeg" alt="img" width="600px">
    <p id="sign">SignUp Account</p>
        <p id="scnd">Its free and always will be.</p>
    
    <input type="text" id="fname" placeholder="First Name">
    <input type="text" id="lname" placeholder="Last Name">
    <input type="text" size="47" id="yourem" placeholder="Your Email or phone number">
    <input type="password" size="47" id="newpswd" placeholder="New Password">
    <label for="" id="dob">Date Of Birth:</label>
    <input type="date" id="date">
    <label for="" id="gender">Gender:
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
    </label>
    <label for="" id="brd">
    <small>Why do I need to provide my birthday?</small>
    </label>
    <p id="terms">
        By clicking Sign Up,you agree to our <a href=""> Terms, Data policy</a><br> and <a href=""> Cookie policy</a> you may recieve SMS notification <br> 
        from and opt out at any time.
    </p>
    <button id="signup">Sign Up</button>
